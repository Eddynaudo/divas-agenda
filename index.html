<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diva's Agenda</title>
  <meta name="theme-color" content="#0b0a10">
  <meta name="description" content="Agenda professionale di Diva's Hairboutique">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Diva's">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sfondo stellato animato -->
  <div class="sky" aria-hidden="true"><div class="sky-img"></div></div>
  <canvas id="sparkles" aria-hidden="true"></canvas>

  <!-- LOGIN -->
  <section id="auth" class="auth hidden">
    <img src="img/logo.png" alt="Diva's Hairboutique" class="auth-logo">
    <form id="authForm" class="glass auth-card" autocomplete="on">
      <h1>Bentornata</h1>
      <p class="muted">Accedi alla tua agenda</p>
      <label>Email<input type="email" id="authEmail" required autocomplete="username" inputmode="email" autocapitalize="off"></label>
      <label>Password<input type="password" id="authPwd" required minlength="6" autocomplete="current-password"></label>
      <button class="btn gold block" type="submit" id="authBtn">Accedi</button>
      <p class="auth-msg" id="authMsg" role="status"></p>
      <div class="auth-links" style="justify-content:center">
        <button type="button" class="link" id="forgotBtn">Password dimenticata?</button>
      </div>
    </form>
    <p class="note" style="text-align:center;max-width:320px">Gli account dei dipendenti vengono creati dall'amministratrice del salone.</p>
  </section>

  <!-- BLOCCO BIOMETRICO -->
  <section id="lock" class="auth hidden">
    <img src="img/logo.png" alt="Diva's Hairboutique" class="auth-logo">
    <div class="glass auth-card" style="align-items:center;text-align:center">
      <div class="bio-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 3.5H5.5a2 2 0 0 0-2 2V7M17 3.5h1.5a2 2 0 0 1 2 2V7M7 20.5H5.5a2 2 0 0 1-2-2V17M17 20.5h1.5a2 2 0 0 0 2-2V17"/><path d="M9 9v1.2M15 9v1.2M12 9v4h-1M9.5 15.5c1.4 1.1 3.6 1.1 5 0"/></svg>
      </div>
      <h1 id="lockTitle">Ciao!</h1>
      <p class="muted">L'agenda è bloccata</p>
      <button class="btn gold block" id="unlockBtn">Sblocca con Face ID / impronta</button>
      <p class="auth-msg" id="lockMsg" role="status"></p>
      <button type="button" class="link" id="lockPwdBtn">Accedi con la password</button>
    </div>
  </section>

  <!-- APP -->
  <div id="app" class="hidden">
    <header class="topbar">
      <img src="img/logo.png" alt="" class="top-logo">
      <div class="top-title">
        <span class="eyebrow" id="topEyebrow">Agenda</span>
        <strong id="topTitle">Oggi</strong>
      </div>
      <button class="icon-btn" id="todayBtn" aria-label="Vai a oggi" title="Oggi">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="12" cy="14.5" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
    </header>

    <main id="view"></main>

    <button class="fab" id="fab" aria-label="Nuovo appuntamento">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabbar" aria-label="Sezioni">
      <button data-tab="agenda" class="active">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg><span>Agenda</span>
      </button>
      <button data-tab="clienti">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg><span>Clienti</span>
      </button>
      <button data-tab="cassa">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M7 15h4"/></svg><span>Cassa</span>
      </button>
      <button data-tab="magazzino">
        <svg viewBox="0 0 24 24"><path d="M3.5 8 12 3.8 20.5 8v9.5L12 21.7 3.5 17.5z"/><path d="M3.5 8 12 12.2 20.5 8M12 12.2v9.5M7.8 5.9l8.5 4.2"/></svg><span>Magazzino</span>
      </button>
      <button data-tab="impostazioni">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><span>Impostazioni</span>
      </button>
    </nav>
  </div>

  <!-- Sheet modale -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <section class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
